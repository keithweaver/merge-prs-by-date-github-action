name: "Merge PRs by Date"
description: "Automatically merges pull requests based on dates in their titles"
author: "keithweaver"
branding:
  icon: "git-merge"
  color: "green"
runs:
  using: docker
  image: Dockerfile
inputs:
  repo_owner:
    description: "The owner of the repository (username or organization)"
    required: true
  repo:
    description: "The repository name"
    required: true
  github_access_token:
    description: "GitHub access token with repo permissions"
    required: true
  merge_method:
    description: "Merge strategy: merge, squash, or rebase"
    required: false
    default: "merge"
  timezone:
    description: "IANA timezone used for dates in PR titles"
    required: false
    default: "UTC"
